<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>𝐒𝐭𝐚𝐫𝐋𝐢𝐠𝐡𝐭</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
:root{
--page:#080808;--panel:#1b1c1e;--panel2:#111214;
--muted:#85878b;--red:#d5092c;--green:#20ad08;--gold:#d18a08;
}
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#f5f5f5;font-family:Roboto,Arial,sans-serif;user-select:none;overflow-x:hidden}

/* LOADING SCREEN CSS */
#loading-screen{
position:fixed;
inset:0;
background:#000;
z-index:99999;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
transition:opacity .5s ease;
}
.spribe-logo-container{
display:flex;
flex-direction:column;
align-items:center;
gap:12px;
animation:fadeInUp .6s ease forwards;
}
.powered-by-text{
color:#888;
font-size:11px;
letter-spacing:3px;
text-transform:uppercase;
font-weight:500;
}
.spribe-logo-wrapper{
display:flex;
align-items:center;
gap:12px;
}
.spribe-icon{
width:45px;
height:45px;
position:relative;
}
.spribe-icon svg{
width:100%;
height:100%;
}
.spribe-text{
color:#fff;
font-size:34px;
font-weight:900;
letter-spacing:4px;
font-family:'Roboto',sans-serif;
}
.entertainment-text{
color:#666;
font-size:9px;
letter-spacing:4px;
text-transform:uppercase;
margin-top:-5px;
}
.loading-dots{
display:flex;
gap:10px;
margin-top:18px;
}
.dot{
width:10px;
height:10px;
background:#e30611;
border-radius:50%;
animation:dotPulse 1.4s ease-in-out infinite;
}
.dot:nth-child(2){ animation-delay:.2s; }
.dot:nth-child(3){ animation-delay:.4s; }
@keyframes dotPulse{
0%,80%,100%{ transform:scale(0.5); opacity:.4; }
40%{ transform:scale(1.1); opacity:1; }
}
@keyframes fadeInUp{
from{ opacity:0; transform:translateY(20px); }
to{ opacity:1; transform:translateY(0); }
}

.topbar{height:30px;background:#050505;padding:0 12px;font-size:11px}
.header{height:43px;background:#1b1c1e;display:flex;align-items:center;padding:0 11px;gap:8px}
.brand{font-size:25px;font-weight:900;font-style:italic;color:#ff1744;letter-spacing:1px;text-shadow:1px 1px 0 #9b001f,2px 2px 0 #720018,3px 3px 0 #4a0010,4px 4px 0 #250008,0 0 12px #ff1744,0 0 22px #ff174488;transform:perspective(300px) rotateX(8deg);display:inline-block}
.balance{margin-left:auto;color:#20b90b;font-size:14px;font-weight:700}
.balance small{color:#aaa;font-weight:400}
.menu{font-size:23px;color:#aaa;border:0;background:transparent;padding:7px;cursor:pointer}
.history{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;overflow:hidden;background:#090909}
.hist-wrapper{display:flex;gap:22px;overflow-x:auto;align-items:center;scrollbar-width:none}
.hist-item{font-size:12px;font-weight:500;color:#a54bdb;flex-shrink:0}
.history-more{border:0;background:#292a2d;color:#ddd;border-radius:15px;padding:5px 10px}
.game-wrap{padding:0 5px}
.display-card{height:clamp(225px,62vw,255px);position:relative;overflow:hidden;background:#030303;border:1px solid #282828;border-radius:0 0 18px 18px}
 .rays{position:absolute;inset:-8%;transform-origin:0% 100%;background:url("https://i.ibb.co.com/FbTkW6DF/file-000000003738821191d5f80ea74d42aa.png") center center/cover no-repeat,repeating-conic-gradient(from 247deg at 0% 100%,rgba(23,23,23,.42) 0deg 9deg,rgba(3,3,3,.42) 9deg 18deg);opacity:.9;animation:raysDrift 8s ease-in-out infinite;will-change:transform}
.rays:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 58% 54%,rgba(0,105,255,.48) 0%,rgba(0,70,180,.25) 28%,rgba(0,0,0,0) 64%);animation:blueGlow 3.2s ease-in-out infinite alternate}
.rays:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 63% 48%,rgba(0,153,255,.18),transparent 52%);mix-blend-mode:screen;animation:blueSweep 5s ease-in-out infinite alternate}
@keyframes raysDrift{0%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.055) rotate(2.4deg)}100%{transform:scale(1) rotate(0deg)}}
@keyframes blueGlow{0%{opacity:.55;transform:scale(.94)}100%{opacity:1;transform:scale(1.08)}}
@keyframes blueSweep{0%{opacity:.25;transform:translateX(-3%)}100%{opacity:.8;transform:translateX(3%)}}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.falling-lines{
  position:absolute;inset:-35%;z-index:1;pointer-events:none;opacity:0;
  /* Rotate the subtle white flight rays around the lower-left flight origin. */
  transform-origin:20.6% 79.4%;
  background:
    repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(255,255,255,.025) 0deg 1deg,
      transparent 1deg 12deg),
    radial-gradient(ellipse at 50% 50%,
      transparent 0 28%,
      rgba(255,255,255,.025) 48%,
      transparent 72%);
  filter:blur(1.2px);
  mix-blend-mode:screen;
}
.display-card.flight-active .falling-lines{
  opacity:.34;
  animation:fallingLines 18s linear infinite;
}
@keyframes fallingLines{
  from{transform:rotate(0deg) scale(1.02)}
  to{transform:rotate(360deg) scale(1.02)}
}
.multiplier{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:3;font-size:48px;font-weight:700;color:white;text-shadow:0 2px 12px #000}
.state-text{font-size:15px;font-weight:400;margin-bottom:10px}
.crashed{color:#e00028!important}
.win-popup{position:absolute;z-index:5;top:65%;left:50%;transform:translate(-50%,-50%) scale(0);background:#1daa0b;color:white;border:2px solid white;border-radius:13px;padding:8px 18px;text-align:center;transition:.2s;pointer-events:none}
.win-popup.show{transform:translate(-50%,-50%) scale(1)}
.game-live-tag{position:absolute;z-index:4;right:9px;bottom:8px;background:#292a2de8;border:1px solid #414247;border-radius:18px;padding:3px 7px;display:flex;align-items:center;gap:0;height:23px;color:#ddd}
.game-live-tag img{width:17px;height:17px;border-radius:50%;object-fit:cover;border:1px solid #c8c8c8;margin-left:-4px;background:#222}
.game-live-tag img:first-child{margin-left:0}
.game-live-tag span{font-size:9px;font-weight:700;margin-left:5px;min-width:16px;text-align:right}
.bet-container{padding:5px;display:flex;flex-direction:column;gap:6px}
.bet-panel{background:#1b1c1e;border-radius:15px;padding:8px 9px 9px}
.tab-buttons{display:flex;height:31px;margin-bottom:7px;background:#111214;border-radius:30px;padding:2px}
.tab-btn{flex:1;border:0;background:transparent;color:#aaa;font-size:12px;border-radius:25px}
.tab-btn.active{background:#303135;color:#eee}
.main-controls{display:grid;grid-template-columns:minmax(95px,.82fr) minmax(0,1.18fr);gap:7px;align-items:center}
.plus-minus{height:36px;background:#111214;border:1px solid #303135;border-radius:35px;display:flex;align-items:center;justify-content:space-around}
.plus-minus button{height:25px;width:25px;border:0;border-radius:50%;background:#303135;color:#c8c8c8;font-size:18px}
.plus-minus input{width:45px;min-width:0;background:transparent;border:0;color:#eee;text-align:center;font-size:15px;font-weight:700;outline:0}
.quick-bets{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:5px}
.q-btn{height:25px;border:0;border-radius:24px;background:#111214;color:#999;font-size:11px}
.btn-main{height:82px;border:1px solid #aaa;border-radius:14px;color:white;font-size:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;box-shadow:0 0 0 3px #111}
.btn-bet{background:#20ad08}
.btn-cashout{background:#e5a000;color:#111}
.btn-waiting{background:#c90024;color:white}
.auto-controls{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.auto-controls.show{display:grid}
.auto-field{background:#111214;border-radius:12px;padding:6px;font-size:9px;display:flex;justify-content:space-between;align-items:center}
.auto-field input{width:65px;background:#242528;border:0;border-radius:6px;padding:5px;color:#fff}
.live-stats{margin:0 5px 12px;background:#1b1c1e;border-radius:15px;padding:8px 9px}
.stat-tabs{display:flex;background:#111214;border-radius:28px;padding:2px;margin-bottom:6px;gap:3px}
.stat-tabs button{flex:1;border:0;background:transparent;color:#aaa;border-radius:20px;padding:6px 1px;font-size:11px}
.stat-tabs button.active{background:#303135;color:white}
.history-filters{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.filter-row{display:flex;gap:4px}
.filter-btn,.period-btn{border:0;border-radius:12px;background:#242528;color:#999;padding:5px 9px;font-size:10px}
.filter-btn.active,.period-btn.active{background:#3a3b3f;color:#fff}
.stat-summary{background:#111214;border-radius:10px;padding:7px;display:flex;justify-content:space-between;align-items:center;color:#aaa}
.stat-summary strong{font-size:14px;color:#eee}
.bet-list-container{max-height:150px;overflow:auto;margin-top:6px}
.bet-list-head,.bet-row{display:grid;grid-template-columns:1.5fr .8fr .5fr .8fr;gap:4px;padding:7px 9px;font-size:10px}
.bet-list-head{color:#777}
.bet-row{background:#111214;border-radius:25px;margin:4px 0;color:#bbb}
.bet-row span:last-child{text-align:right;color:#20ad08}
.bet-row .loss{color:#e00028!important}
.bet-empty{text-align:center;padding:18px;color:#777;font-size:11px}

/* PROFILE SETTINGS */
.profile-overlay{
display:none;position:fixed;inset:0;z-index:999;
background:rgba(0,0,0,.65);padding:0 9%;
align-items:flex-start;justify-content:center;
}
.profile-overlay.open{display:flex}
.profile-menu{
width:100%;max-width:550px;margin-top:90px;
background:#1b1c1e;border-radius:13px;overflow-y:auto;
max-height:85vh;border:1px solid #303135;
box-shadow:0 12px 40px #000;
}
.profile-top{
min-height:105px;padding:15px 17px;
display:flex;align-items:center;justify-content:space-between;
background:#292a2d;gap:8px;
}
.profile-user{display:flex;align-items:center;gap:13px;min-width:0}
.profile-user img{
width:67px;height:67px;border-radius:50%;
object-fit:cover;border:2px solid #3979bd;
}
.profile-user strong{font-size:23px;color:white}
.profile-user small{display:block;margin-top:5px;color:#999;font-size:11px}
.avatar-change{
background:#242528;border:1px solid #45464b;
color:#aaa;padding:10px 15px;border-radius:30px;
font-size:14px;cursor:pointer;
}
.setting-row{
width:100%;min-height:65px;padding:0 20px;
display:flex;align-items:center;gap:15px;
border:0;border-bottom:1px solid #333538;
background:transparent;color:#eee;
font-family:inherit;font-size:17px;text-align:left;
}
.setting-icon{width:30px;color:#858991;font-size:24px;text-align:center;flex-shrink:0}
.menu-action{cursor:pointer}
.menu-action:active{background:#303135}
.settings-gap{height:22px;background:#292a2d}
.switch{margin-left:auto;position:relative;width:48px;height:27px;flex-shrink:0}
.switch input{display:none}
.switch .slider{position:absolute;inset:0;background:#111214;border-radius:30px;cursor:pointer;transition:.2s}
.switch .slider:before{
content:"";position:absolute;width:20px;height:20px;
left:4px;top:3.5px;border-radius:50%;background:#999;transition:.2s;
}
.switch input:checked+.slider:before{transform:translateX(20px);background:#20ad08}
.switch input:checked+.slider{background:#303135}

/* AVATAR PICKER */
.avatar-picker{
display:none;
position:fixed;
inset:0;
z-index:2000;
background:rgba(0,0,0,.88);
align-items:center;
justify-content:center;
padding:20px;
}
.avatar-picker.open{display:flex}
.avatar-box{
width:100%;
max-width:350px;
background:#1b1c1e;
border:1px solid #444;
border-radius:16px;
padding:18px;
text-align:center;
box-shadow:0 12px 40px #000;
}
.avatar-box h3{
margin:0 0 18px;
color:white;
font-size:19px;
}
.avatar-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:13px;
}
.avatar-grid img{
width:75px;
height:75px;
max-width:100%;
border-radius:50%;
object-fit:cover;
border:2px solid #555;
cursor:pointer;
transition:.2s;
}
.avatar-grid img:active{
transform:scale(.92);
border-color:#20ad08;
}
.avatar-grid img.selected{
border:3px solid #20ad08;
box-shadow:0 0 12px #20ad0888;
}
.avatar-box button{
margin-top:20px;
width:100%;
padding:11px;
border:0;
border-radius:25px;
background:#d5092c;
color:white;
font-weight:700;
font-size:14px;
cursor:pointer;
}

/* POPUP */
.settings-info-overlay{
display:none;position:fixed;inset:0;z-index:1100;
background:rgba(0,0,0,.8);align-items:center;
justify-content:center;padding:20px;
}
.settings-info-overlay.open{display:flex}
.settings-info-box{
width:100%;max-width:380px;background:#202124;
border:1px solid #414247;border-radius:17px;
padding:22px;color:#eee;position:relative;line-height:1.7;
}
.settings-info-box h3{margin:0 30px 15px 0;color:white}
.info-close{
position:absolute;right:13px;top:12px;width:30px;height:30px;
border:0;border-radius:50%;background:#35363a;color:white;font-size:22px;
}
#info-content{color:#bbb;font-size:14px}
.history-modal{display:none;position:fixed;inset:0;z-index:1200;background:#000c;padding:12px;align-items:flex-start;justify-content:center}
.history-modal.open{display:flex}
.history-dialog{width:min(100%,440px);margin-top:42px;background:#17181a;border:1px solid #343538;border-radius:13px;padding:12px}
.history-head{display:flex;justify-content:space-between;margin-bottom:10px}
.history-head button{border:0;background:#303135;color:white;border-radius:50%;width:25px;height:25px;font-size:19px}
.history-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.history-grid .hist-item{text-align:center;padding:7px 2px;border-radius:14px;background:#252629}
#sound-overlay{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:1500;display:flex;align-items:center;justify-content:center}
.overlay-btn{border:0;border-radius:35px;background:#d18a08;color:white;padding:17px 28px;font-size:18px;font-weight:900}

/* ALL USERS */
.all-users{
margin:0 5px 15px;
padding:10px;
background:#1b1c1e;
border-radius:15px;
border:1px solid #292a2d;
}
.all-users-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}
.all-users-title{
font-size:15px;
font-weight:900;
}
.-label{
font-size:9px;
color:#20ad08;
background:#102a13;
padding:5px 8px;
border-radius:15px;
}
.users-summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin-bottom:10px;
}
.users-summary-box{
background:#111214;
border-radius:10px;
padding:9px;
}
.users-summary-box small{
display:block;
color:#888;
font-size:10px;
margin-bottom:5px;
}
.users-summary-box strong{
font-size:16px;
color:#20ad08;
}
.all-users-list{
display:flex;
flex-direction:column;
gap:7px;
}
.all-user-card{
display:flex;
align-items:center;
gap:9px;
background:#111214;
border-radius:11px;
padding:9px;
animation:userEnter .35s ease;
}
@keyframes userEnter{
from{opacity:0;transform:translateY(-8px)}
to{opacity:1;transform:translateY(0)}
}
.all-user-avatar{
width:39px;
height:39px;
border-radius:50%;
object-fit:cover;
border:2px solid #34363a;
flex-shrink:0;
}
.all-user-info{
flex:1;
min-width:0;
}
.all-user-name{
font-size:12px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.all-user-status{
font-size:9px;
color:#20ad08;
margin-top:5px;
}
.all-user-amount{
text-align:right;
color:#20ad08;
font-size:13px;
font-weight:900;
white-space:nowrap;
}
.all-user-cashout{
display:inline-block;
margin-top:5px;
font-size:8px;
background:#123b18;
color:#35d34c;
border:1px solid #236b2c;
padding:3px 7px;
border-radius:20px;
font-weight:700;
}
.all-users-footer{
text-align:center;
font-size:16px;
font-weight:900;
color:#fff;
padding-top:12px;
letter-spacing:1px;
text-shadow:0 0 8px #20ad08, 0 0 15px #20ad08;
}

@media(max-width:390px){
.profile-overlay{padding:0 9%}
.profile-menu{margin-top:90px}
.profile-user img{width:65px;height:65px}
.setting-row{min-height:63px;font-size:16px}
.display-card{height:220px}
.avatar-grid img{width:68px;height:68px}
}
@media(min-width:600px){
.display-card{height:310px;max-width:650px;margin:auto}
.bet-container,.live-stats{max-width:650px;margin-left:auto;margin-right:auto}
.all-users{max-width:640px;margin-left:auto;margin-right:auto}
}
.all-users,
.all-users * {
    color: white !important;
}
/* তোমার আগের CSS কোড এখানে */

/* Multiplier text stays clean: no glowing count effect. */
#mult-text.rising-glow {
    text-shadow: 0 2px 12px #000;
    animation: none;
}

/* Video-style background: blue before 2x, violet from 2x onward. */
.display-card .rays {
    transition: filter .45s ease, opacity .45s ease;
}
.display-card .rays:before {
    background: radial-gradient(ellipse at 58% 54%,
        rgba(0,105,255,.48) 0%,
        rgba(0,70,180,.25) 28%,
        rgba(0,0,0,0) 64%);
    transition: background .45s ease, opacity .45s ease;
}
.display-card .rays:after {
    transition: background .45s ease, opacity .45s ease;
}
.display-card.high-multiplier .rays:before {
    background: radial-gradient(ellipse at 58% 54%,
        rgba(143,35,255,.58) 0%,
        rgba(91,25,190,.32) 32%,
        rgba(0,0,0,0) 67%);
}
.display-card.high-multiplier .rays:after {
    background: radial-gradient(ellipse at 63% 48%,
        rgba(210,70,255,.25), transparent 55%);
}
.display-card.high-multiplier .rays {
    filter: saturate(1.22);
}
/* Multiplier এবং FLEW AWAY লেখা বড় ও মোটা */
#mult-text {
    font-size: 65px !important;
    font-weight: 900 !important;
}

#state-text {
    font-size: 25px !important;
    font-weight: 900 !important;
}

/* Waiting GIF Styles */
#waiting-gif {
  display: none;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(78%, 280px);
  height: 150px;
  object-fit: contain;
  pointer-events: none;
  z-index: 4;
}

#waiting-gif.show {
  display: block;
}

#mult-text.countdown-hidden {
  visibility: hidden;
}


/* Video-style All Bets panel only */
.all-bets-panel{margin:0 5px 12px;padding:8px 8px 10px;background:#1b1c1e;border-radius:14px}
.all-bets-panel .stat-tabs{height:28px;margin-bottom:8px;gap:5px}
.all-bets-panel .stat-tabs button{font-size:11px;padding:5px 2px}
.all-bets-panel .stat-tabs button.active{background:#35363a;color:#fff}
.all-bets-summary{padding:7px 9px;margin-bottom:7px;background:#111214;border-radius:8px}
.all-bets-summary strong{font-size:13px}
.all-bets-summary span{font-size:9px;color:#92949a}
.all-bets-panel .bet-list-container{max-height:390px;overflow-y:auto;margin-top:5px;scrollbar-width:thin}
.all-bets-panel .bet-list-head{display:none}
.all-bets-panel .bet-row{
  display:grid;grid-template-columns:minmax(0,1.55fr) .85fr .48fr .9fr;
  align-items:center;gap:5px;min-height:34px;margin:4px 0;padding:5px 7px;
  border-radius:18px;background:#101113;color:#c8c9cc;font-size:10px;
}
.all-bets-panel .bet-row.winner{background:linear-gradient(90deg,#183d20,#245b2b);color:#f3fff4}
.all-bets-panel .bet-player{display:flex;align-items:center;gap:6px;min-width:0}
.all-bets-panel .bet-player img{width:22px;height:22px;flex:0 0 22px;border-radius:50%;object-fit:cover}
.all-bets-panel .bet-player span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d8d8da}
.all-bets-panel .bet-x{color:#b45cff;font-weight:800;text-align:center}

import{getDatabase,ref,onValue,runTransaction,update,push,serverTimestamp,query,limitToLast}from"https://www.gstatic.com/firebasejs/9.6.10/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyAy9PPm5UJpuhxfuPhNgqsUOOBFXXlmzU8",
authDomain:"pay-admin-98aca.firebaseapp.com",
databaseURL:"https://pay-admin-98aca-default-rtdb.firebaseio.com",
projectId:"pay-admin-98aca",
storageBucket:"pay-admin-98aca.firebasestorage.app",
messagingSenderId:"183780095284",
appId:"1:183780095284:web:c26822afd79efc4a826161",
measurementId:"G-B6EF5RW1WZ"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const params=new URLSearchParams(location.search);
let userPhone=params.get("user")||localStorage.getItem("userPhone");
let IS_WIN_ALLOWED=true;
let currentTimerInterval=null;

window.globalBalance=0;

const marketRef=ref(db,"market_sync");
const historyRef=ref(db,"market_history");

if(userPhone){
localStorage.setItem("userPhone",userPhone);
onValue(ref(db,"users/"+userPhone),s=>{
let d=s.val();
if(d&&Number.isFinite(Number(d.balance))){
window.globalBalance=Number(d.balance);
document.getElementById("balance").textContent=window.globalBalance.toFixed(2);
}
});
}

onValue(query(historyRef,limitToLast(15)),s=>{
let d=s.val();
let vals=d?Object.values(d).reverse().map(v=>Number(v).toFixed(2)):[];
let colors=v=>Number(v)>=10?"#36a8e9":Number(v)>=2?"#a54bdb":"#d34ac4";

const wrapper=document.querySelector(".hist-wrapper");
wrapper.innerHTML="";

vals.slice(0,12).forEach(v=>{
let e=document.createElement("span");
e.className="hist-item";
e.textContent=v+"x";
e.style.color=colors(v);
wrapper.appendChild(e);
});

document.getElementById("history-grid").innerHTML=
vals.length?vals.map(v=>`<span class="hist-item" style="color:${colors(v)}">${v}x</span>`).join(""):'<span class="bet-empty">No round history yet</span>';
});

onValue(ref(db,"admin_settings/aviator_control"),s=>{
IS_WIN_ALLOWED=s.val()!==false;
if(currentTimerInterval)clearInterval(currentTimerInterval);
startAutoServer();
});

function startAutoServer(){
if(currentTimerInterval)clearInterval(currentTimerInterval);

let futureVal;
if(!IS_WIN_ALLOWED){
futureVal=(Math.random()*.5+1).toFixed(2);
}else{
let luck=Math.random();
futureVal=luck<.15?(Math.random()*10+10).toFixed(2):
luck<.3?(Math.random()*3+2).toFixed(2):
(Math.random()*.8+1.1).toFixed(2);
}

let wait=5;

currentTimerInterval=setInterval(()=>{
update(marketRef,{
status:"waiting",
timer:wait,
crashAt:futureVal,
lastTick:serverTimestamp()
});

if(wait<=0){
clearInterval(currentTimerInterval);

update(marketRef,{
status:"flying",
crashAt:futureVal,
startTime:Date.now(),
lastTick:serverTimestamp()
});

let duration=Math.log(Number(futureVal))/.1*1000;

setTimeout(()=>{
update(marketRef,{
status:"crashed",
lastTick:serverTimestamp(),
crashVal:futureVal
});

push(historyRef,Number(futureVal));

setTimeout(startAutoServer,3500);
},Math.max(150,duration));
}
wait--;
},1000);
}

onValue(marketRef,s=>{
let d=s.val();
if(!d)return;

if(d.status==="flying"){
window.serverCrashAt=Number(d.crashAt);
window.serverStartTime=Number(d.startTime);
if(!window.isFlying)window.launchPlane();
}else if(d.status==="waiting"){
window.resetRound(Number(d.timer));
}else if(d.status==="crashed"){
window.crash(d.crashVal||d.crashAt);
}
});

window.updateSecureBalance=change=>{
if(!userPhone){
alert("User ID missing. Open the game with ?user=PHONE");
return Promise.resolve(false);
}

return runTransaction(ref(db,"users/"+userPhone),curr=>{
if(!curr)return;
let balance=Number(curr.balance)||0;
let newBalance=Number((balance+change).toFixed(2));
if(newBalance<0)return;
curr.balance=newBalance;
return curr;
}).then(r=>!!r.committed).catch(e=>{
console.error(e);
alert("Balance update failed");
return false;
});
};

// Automatically connect to the market server when the page initializes.
onValue(marketRef,s=>{
let v=s.val();
if(!v||Date.now()-Number(v.lastTick||0)>12000)startAutoServer();
},{onlyOnce:true});
</script>

<!-- GAME ENGINE -->
<script>
window.isFlying=false;
window.bets={
1:{active:false,waiting:false,amt:0,cashed:false},
2:{active:false,waiting:false,amt:0,cashed:false}
};

let multiplier=1,canvas,ctx,animationFrame;
let planeImg=new Image();
planeImg.src="https://videotourl.com/gifs/1794670090495-dfa8f2ba-b192-47b4-8fd7-56c554a6498e.gif";

// Keep the animated GIF as a real HTML image so every GIF frame stays animated.
const planeSprite=document.createElement("img");
planeSprite.src="https://videotourl.com/gifs/1794670090495-dfa8f2ba-b192-47b4-8fd7-56c554a6498e.gif";
planeSprite.alt="Airplane";
planeSprite.draggable=false;
planeSprite.style.cssText="position:absolute;display:none;width:70px;height:51px;object-fit:contain;pointer-events:none;z-index:2;transform:translate(-50%,-50%);";
document.getElementById("display-card").appendChild(planeSprite);

const flySound=document.getElementById("fly-sound");
const crashSound=document.getElementById("crash-sound");

function init(){
canvas=document.getElementById("gameCanvas");
ctx=canvas.getContext("2d");
resizeCanvas();
window.addEventListener("resize",resizeCanvas);
}

function resizeCanvas(){
if(!canvas)return;
let r=canvas.getBoundingClientRect();
canvas.width=r.width*devicePixelRatio;
canvas.height=r.height*devicePixelRatio;
ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}

window.resetRound=time=>{
window.isFlying=false;
cancelAnimationFrame(animationFrame);
multiplier=1;
document.getElementById("display-card").classList.remove("high-multiplier","flight-active");

document.getElementById("state-text").textContent="";
document.getElementById("mult-text").textContent="NEXT ROUND IN "+time+"s";
document.getElementById("mult-text").style.color="#888";
document.getElementById("mult-text").style.fontSize="30px";
document.getElementById("mult-text").classList.remove("crashed");
document.getElementById("win-popup").classList.remove("show");

/* Rotate the three live-player thumbnails with the authoritative countdown. */
const liveAvatarPool=[
"https://i.ibb.co/B5jPm10y/av-116.png",
"https://i.ibb.co/GQTdPJ4g/av-78.png",
"https://i.ibb.co/vCrShN6W/av-47.png",
"https://i.ibb.co/qzy1dzz/av-103.png",
"https://i.ibb.co/Wv5QsLMG/av-83.png",
"https://i.ibb.co/C5kBfyVz/av-89.png"
];
document.querySelectorAll(".game-live-tag img").forEach((img,index)=>{
  img.src=liveAvatarPool[(Math.max(0,Number(time)||0)+index*2)%liveAvatarPool.length];
});

if(flySound.paused && window.aviatorSettings.music && window.aviatorSettings.sound){
flySound.play().catch(()=>{});
}

if(time===5){
if(typeof window.startAllBetsRound==="function")window.startAllBetsRound();
/* A cashed bet is settled for the whole countdown; clear it only once at the new round boundary. */
for(let i=1;i<=2;i++){
  if(window.bets[i].cashed){window.bets[i].active=false;window.bets[i].cashed=false;}
}

for(let i=1;i<=2;i++){
if(document.getElementById("auto-bet-"+i)?.checked&&!window.bets[i].active&&!window.bets[i].waiting){
let a=Number(document.getElementById("amt"+i).value);
if(a>0&&window.globalBalance>=a){
window.bets[i].amt=a;
window.bets[i].waiting=true;
window.updateSecureBalance(-a);
}
}
}
}

drawPlane(1,true);

for(let i=1;i<=2;i++){
if(window.bets[i].waiting){
window.bets[i].active=true;
window.bets[i].waiting=false;
}
updateButton(i);
}
};

window.launchPlane=()=>{
if(window.isFlying)return;
window.isFlying=true;
document.getElementById("display-card").classList.add("flight-active");
if(typeof window.startAllBetsFlight==="function")window.startAllBetsFlight();

if(window.aviatorSettings.sound&&window.aviatorSettings.music){
flySound.play().catch(()=>{});
}

document.getElementById("state-text").textContent="";
document.getElementById("mult-text").style.color="#fff";
document.getElementById("mult-text").style.fontSize="52px";

function animate(){
if(!window.isFlying)return;

let elapsed=(Date.now()-window.serverStartTime)/1000;
multiplier=Math.exp(.1*elapsed);

if(multiplier>=window.serverCrashAt){
multiplier=window.serverCrashAt;
window.crash(window.serverCrashAt);
return;
}

document.getElementById("mult-text").textContent=multiplier.toFixed(2)+"x";
document.getElementById("mult-text").classList.remove("rising-glow");
/* Switch the playfield background exactly when the live multiplier reaches 2.00x. */
document.getElementById("display-card").classList.toggle("high-multiplier", multiplier>=2);
if(window.aviatorSettings.animation){
drawPlane(multiplier);
}else{
ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
planeSprite.style.display="none";
}

for(let i=1;i<=2;i++){
let a=Number(document.getElementById("auto-cash-val-"+i).value);
if(window.bets[i].active&&!window.bets[i].cashed&&a>1&&multiplier>=a){
window.cashOut(i);
}
}

for(let i=1;i<=2;i++){
if(window.bets[i].active&&!window.bets[i].cashed)updateButton(i);
}

animationFrame=requestAnimationFrame(animate);
}
animate();
};

function drawPlane(m,waiting=false,departure=null){
const w=canvas.clientWidth;
const h=canvas.clientHeight;

ctx.clearRect(0,0,w,h);

let x,y;

if(waiting){
x=43;
y=h-43;
}else{
// Launch immediately from the lower-left, then gently bob around the upper-middle.
let elapsed=(Date.now()-window.serverStartTime)/1000;
if(!Number.isFinite(elapsed)||elapsed<0)elapsed=0;

const launchDuration=1.9;
const launchProgress=Math.min(1,elapsed/launchDuration);
const eased=1-Math.pow(1-launchProgress,2.2);
const startX=43;
const targetX=Math.max(startX,Math.min(w-55,w*0.57));
const startY=h-39;
const targetY=Math.max(48,h*0.30);

if(launchProgress<1){
x=startX+(targetX-startX)*eased;
y=startY+(targetY-startY)*eased;
}else{
const bobTime=elapsed-launchDuration;
x=targetX+Math.sin(bobTime*1.15)*5;
y=targetY+Math.sin(bobTime*3.1)*18;
}

x=Math.max(43,Math.min(w-43,x));
y=Math.max(43,Math.min(h-43,y));

// Keep the red trail and its soft translucent red glow during normal flight.
// Both effects disappear while the plane flies away.
if(!departure){
// Soft red light beneath the trail, fading naturally into the lower area.
ctx.save();
ctx.beginPath();
ctx.moveTo(0,h-4);
ctx.quadraticCurveTo(x*.45,h-8,x,y);
ctx.lineTo(x,h);
ctx.lineTo(0,h);
ctx.closePath();
const glow=ctx.createLinearGradient(0,Math.max(0,y-18),0,h);
glow.addColorStop(0,"rgba(235,12,55,0.015)");
glow.addColorStop(0.42,"rgba(235,12,55,0.075)");
glow.addColorStop(1,"rgba(235,12,55,0.24)");
ctx.fillStyle=glow;
ctx.shadowColor="rgba(235,12,55,0.34)";
ctx.shadowBlur=22;
ctx.fill();
ctx.restore();

// Bright red curve on top of the glow.
ctx.beginPath();
ctx.strokeStyle="rgba(235,12,55,.96)";
ctx.lineWidth=3.5;
ctx.lineCap="round";
ctx.shadowBlur=8;
ctx.shadowColor="#e10b35";
ctx.moveTo(0,h-4);
ctx.quadraticCurveTo(x*.45,h-8,x,y);
ctx.stroke();
ctx.shadowBlur=0;
}
}

if(departure){
x=departure.x;
y=departure.y;
}

window.lastPlaneX=x;
window.lastPlaneY=y;

const planeWidth=110;
const planeHeight=80;
planeSprite.style.display="block";
planeSprite.style.left=x+"px";
planeSprite.style.top=y+"px";
planeSprite.style.width=planeWidth+"px";
planeSprite.style.height=planeHeight+"px";
planeSprite.style.opacity=departure?departure.alpha:1;
planeSprite.style.transform="translate(-50%,-50%)"+(departure?" rotate(-0.42rad)":"");
}

window.crash=val=>{
if(window.crashDepartureRunning)return;
window.isFlying=false;
if(typeof window.pauseAllBetsRound==="function")window.pauseAllBetsRound();
cancelAnimationFrame(animationFrame);

const crashW=canvas.clientWidth;
const crashH=canvas.clientHeight;
const fromX=Number.isFinite(window.lastPlaneX)?window.lastPlaneX:Math.max(43,crashW-70);
const fromY=Number.isFinite(window.lastPlaneY)?window.lastPlaneY:55;
const departureStart=performance.now();
window.crashDepartureRunning=true;
const flyAwayFrame=now=>{
const t=Math.min(1,(now-departureStart)/680);
const ease=1-Math.pow(1-t,2.15);
drawPlane(multiplier,false,{
x:fromX+(crashW+115-fromX)*ease,
y:fromY+(-125-fromY)*ease,
alpha:1-t
});
if(t<1){
window.crashDepartureFrame=requestAnimationFrame(flyAwayFrame);
}else{
window.crashDepartureRunning=false;
ctx.clearRect(0,0,crashW,crashH);
planeSprite.style.display="none";
}
};
window.crashDepartureFrame=requestAnimationFrame(flyAwayFrame);

flySound.pause();
flySound.currentTime=0;

crashSound.currentTime=0;
if(window.aviatorSettings.sound){
crashSound.play().catch(()=>{});
}

document.getElementById("display-card").classList.remove("high-multiplier","flight-active");
document.getElementById("state-text").textContent="FLEW AWAY!";
/* Keep the authoritative crash multiplier visible after the plane flies away. */
const finalCrashMultiplier=Number(val);
if(Number.isFinite(finalCrashMultiplier)&&finalCrashMultiplier>0){
  multiplier=finalCrashMultiplier;
}
document.getElementById("mult-text").textContent=multiplier.toFixed(2)+"x";
document.getElementById("mult-text").classList.add("crashed");
document.getElementById("mult-text").classList.remove("rising-glow");
document.getElementById("mult-text").style.color="#df0028";

for(let i=1;i<=2;i++){
if(window.bets[i].active&&!window.bets[i].cashed&&window.addAviatorHistoryRecord){
window.addAviatorHistoryRecord(window.bets[i].amt,Number(val),0);
}
window.bets[i].active=false;
updateButton(i);
}
};

window.handleAction=async p=>{
let s=window.bets[p];
let a=Number(document.getElementById("amt"+p).value);

if(!Number.isFinite(a)||a<=0)return alert("Enter a valid bet amount");

if(!window.isFlying){
if(!s.active){
if(window.globalBalance<a)return alert("Insufficient Balance!");
let ok=await window.updateSecureBalance(-a);
if(!ok)return;
s.amt=a;
s.active=true;
}else{
let ok=await window.updateSecureBalance(s.amt);
if(!ok)return;
s.active=false;
}
}else if(s.active&&!s.cashed){
window.cashOut(p);
}
updateButton(p);
};

window.cashOut=async p=>{
let s=window.bets[p];
if(!s.active||s.cashed)return;

let win=Number((s.amt*multiplier).toFixed(2));
s.cashed=true;

let ok=await window.updateSecureBalance(win);
if(!ok){
s.cashed=false;
return;
}

if(window.addAviatorHistoryRecord){
window.addAviatorHistoryRecord(s.amt,multiplier,win);
}

document.getElementById("win-amount").textContent=multiplier.toFixed(2)+"x";
document.getElementById("win-popup").classList.add("show");
document.getElementById("total-win").textContent=win.toFixed(2);

setTimeout(()=>{
document.getElementById("win-popup").classList.remove("show");
},2000);

updateButton(p);
};

function updateButton(p){
let b=document.getElementById("btn"+p);
let s=window.bets[p];

b.className="btn-main";

if(s.waiting){
b.classList.add("btn-waiting");
b.textContent="WAITING...";
}else if(s.cashed){
b.classList.add("btn-waiting");
b.textContent="CASHED OUT";
}else if(s.active&&window.isFlying){
b.classList.add("btn-cashout");
b.innerHTML="Cash Out<br><span>৳ "+(s.amt*multiplier).toFixed(2)+"</span>";
}else if(s.active){
b.classList.add("btn-waiting");
b.textContent="Cancel";
}else{
b.classList.add("btn-bet");
b.innerHTML="Bet<br><span>৳ "+Number(document.getElementById("amt"+p).value||0).toFixed(2)+"</span>";
}
}

window.toggleTab=(p,t)=>{
document.getElementById("tab-bet-"+p).classList.toggle("active",t==="bet");
document.getElementById("tab-auto-"+p).classList.toggle("active",t==="auto");
document.getElementById("auto-ctrl-"+p).classList.toggle("show",t==="auto");
};

window.setAmt=(p,v)=>{
document.getElementById("amt"+p).value=Number(v).toFixed(2);
updateButton(p);
};

window.changeAmt=(p,v)=>{
let e=document.getElementById("amt"+p);
e.value=Math.max(1,(Number(e.value)||1)+v).toFixed(2);
updateButton(p);
};

document.querySelectorAll('[id^="amt"]').forEach(e=>{
e.addEventListener("input",()=>{
let p=Number(e.id.slice(-1));
updateButton(p);
});
});

crashSound.onended=()=>{
if(!window.isFlying&&window.aviatorSettings.sound&&window.aviatorSettings.music){
flySound.play().catch(()=>{});
}
};
</script>

<!-- VIDEO-STYLE ALL BETS DATA -->
<script>
(()=>{
  const avatars=[
    "https://i.ibb.co/B5jPm10y/av-116.png",
    "https://i.ibb.co/GQTdPJ4g/av-78.png",
    "https://i.ibb.co/vCrShN6W/av-47.png",
    "https://i.ibb.co/qzy1dzz/av-103.png",
    "https://i.ibb.co/Wv5QsLMG/av-83.png",
    "https://i.ibb.co/C5kBfyVz/av-89.png"
  ];
  const names=["b***","g***","r***","m***","s***","t***","a***","n***","h***","j***","f***","p***"];
  const rows=[];
  const list=document.getElementById("live-bets-list");
  const count=document.getElementById("fake-count");
  const total=document.getElementById("total-win");
  const tabs=[...document.querySelectorAll(".stat-tab")];
  let view="all",roundBets=0,totalWin=0,feedTimer=null,feedPaused=true,roundToken=0,flightActive=false;
  const rand=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
  const money=n=>Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  // All demo cashouts must be strictly below the authoritative server crash point.
  function maxDemoCashout(){
    const crash=Number(window.serverCrashAt);
    if(!Number.isFinite(crash)||crash<=1.10)return 1.09;
    return Math.max(1.09,Math.floor((crash-0.01)*100+1e-8)/100);
  }
  function demoResult(bet){
    const ceiling=Math.min(4.50,maxDemoCashout());
    const maxCents=Math.floor(ceiling*100+1e-8);
    const winner=flightActive&&maxCents>=110&&Math.random()<.38;
    const mult=winner?rand(110,maxCents)/100:1;
    return {mult:Number(mult.toFixed(2)),win:winner?Number((bet*mult).toFixed(2)):0};
  }
  function makeDemo(){
    const bet=rand(150,7000)+Math.random();
    const result=demoResult(bet);
    return {player:names[rand(0,names.length-1)],avatar:avatars[rand(0,avatars.length-1)],bet:Number(bet.toFixed(2)),mult:result.mult,win:result.win,pending:!flightActive};
  }
  function render(){
    if(!list)return;
    let shown=rows.slice();
    if(view==="previous")shown=shown.slice().reverse();
    if(view==="top")shown=shown.slice().sort((a,b)=>b.win-a.win);
    list.innerHTML=shown.map(r=>`<div class="bet-row ${r.win>0?'winner':''}"><div class="bet-player"><img src="${r.avatar}" alt=""><span>${r.player}</span></div><span>${money(r.bet)}</span><span class="bet-x">${Number(r.mult).toFixed(2)}x</span><span class="bet-win">${money(r.win)}</span></div>`).join("");
    if(count){const live=document.getElementById("live-counter");const same=live?(live.textContent||"0").replace(/,/g,""):String(roundBets);count.textContent=`${same}/${same} Bets`;}
    if(total)total.textContent=money(totalWin);
  }
  function addRow(row=makeDemo()){
    rows.unshift(row);roundBets++;totalWin+=Number(row.win)||0;
    while(rows.length>45){const old=rows.pop();totalWin-=Number(old.win)||0;}
    totalWin=Math.max(0,totalWin);render();
  }
  function stopFeed(){if(feedTimer!==null){clearTimeout(feedTimer);feedTimer=null;}}
  function scheduleFeed(token){
    stopFeed();
    if(feedPaused||token!==roundToken)return;
    feedTimer=setTimeout(()=>{
      if(feedPaused||token!==roundToken)return;
      addRow();scheduleFeed(token);
    },rand(900,1800));
  }
  function startRound(){
    roundToken++;stopFeed();feedPaused=false;flightActive=false;
    rows.length=0;roundBets=0;totalWin=0;
    for(let i=0;i<24;i++)addRow();
    scheduleFeed(roundToken);
  }
  function startFlight(){
    if(flightActive)return;flightActive=true;
    rows.forEach(r=>{if(r.pending){const result=demoResult(r.bet);r.mult=result.mult;r.win=result.win;r.pending=false;}});
    totalWin=rows.reduce((sum,r)=>sum+(Number(r.win)||0),0);render();
  }
  function syncCounter(){render();}
  function pauseRound(){
    flightActive=false;feedPaused=true;roundToken++;stopFeed();
    /* Keep the last settled rows visible; next server countdown repopulates them. */
    render();
  }
  tabs.forEach(btn=>btn.addEventListener("click",()=>{
    tabs.forEach(x=>x.classList.toggle("active",x===btn));view=btn.dataset.view||"all";render();
  }));
  window.startAllBetsRound=startRound;
  window.startAllBetsFlight=startFlight;
  window.syncAllBetsCounter=syncCounter;
  window.pauseAllBetsRound=pauseRound;
  window.addAviatorHistoryRecord=(bet,mult,win)=>{
    addRow({player:"You",avatar:avatars[0],bet:Number(bet)||0,mult:Number(mult)||1,win:Number(win)||0});
  };
  /* Initial feed appears immediately; server countdown will reset it cleanly per round. */
  startRound();
})();
</script>

<!-- PROFILE SETTINGS FUNCTIONALITY -->
<script>
(function(){

const overlay=document.getElementById("profile-overlay");
const infoOverlay=document.getElementById("settings-info-overlay");
const avatarPicker=document.getElementById("avatar-picker");
const profileAvatar=document.getElementById("profile-avatar");

const settings={
sound:true,
music:true,
animation:true
};

window.aviatorSettings=settings;

/* Load saved avatar */
const savedAvatar=localStorage.getItem("b20_profile_avatar");
if(savedAvatar){
profileAvatar.src=savedAvatar;
}

/* Open settings menu */
document.getElementById("open-settings").onclick=function(){
overlay.classList.add("open");
};

overlay.addEventListener("click",function(e){
if(e.target===overlay){
overlay.classList.remove("open");
}
});

/* Sound setting */
document.getElementById("sound-toggle").onchange=function(){
settings.sound=this.checked;

if(!settings.sound){
document.getElementById("crash-sound").pause();
document.getElementById("fly-sound").pause();
}else if(settings.music&&window.isFlying){
document.getElementById("fly-sound").play().catch(()=>{});
}
};

/* Music setting */
document.getElementById("music-toggle").onchange=function(){
settings.music=this.checked;

if(!settings.music){
document.getElementById("fly-sound").pause();
}else if(settings.sound&&window.isFlying){
document.getElementById("fly-sound").play().catch(()=>{});
}
};

/* Animation setting */
document.getElementById("animation-toggle").onchange=function(){
settings.animation=this.checked;

if(!settings.animation&&window.isFlying){
const c=document.getElementById("gameCanvas");
const context=c.getContext("2d");
context.clearRect(0,0,c.width,c.height);
const plane=document.getElementById("display-card").querySelector("img[alt='Airplane']");
if(plane)plane.style.display="none";
}
};

/* OPEN AVATAR PICKER */
document.getElementById("change-avatar").onclick=function(){
avatarPicker.classList.add("open");
overlay.classList.remove("open");

const currentAvatar=profileAvatar.src;
document.querySelectorAll("#avatar-grid img").forEach(img=>{
img.classList.toggle("selected",img.src===currentAvatar);
});
};

/* SELECT AVATAR */
window.selectAvatar=function(imageUrl){

profileAvatar.src=imageUrl;

/* Save selected avatar */
localStorage.setItem("b20_profile_avatar",imageUrl);

/* Highlight selected image */
document.querySelectorAll("#avatar-grid img").forEach(img=>{
img.classList.toggle("selected",img.src===imageUrl);
});

/* Close picker */
avatarPicker.classList.remove("open");
};

/* CLOSE AVATAR PICKER */
window.closeAvatarPicker=function(){
avatarPicker.classList.remove("open");
};

/* Close picker when tapping outside */
avatarPicker.addEventListener("click",function(e){
if(e.target===avatarPicker){
avatarPicker.classList.remove("open");
}
});

/* Info popup */
function showInfo(t,c){
document.getElementById("info-title").textContent=t;
document.getElementById("info-content").textContent=c;
infoOverlay.classList.add("open");
}

document.getElementById("info-close").onclick=function(){
infoOverlay.classList.remove("open");
};

infoOverlay.addEventListener("click",function(e){
if(e.target===infoOverlay){
infoOverlay.classList.remove("open");
}
});

/* Menu actions */
document.querySelectorAll(".menu-action").forEach(btn=>{
btn.addEventListener("click",function(){

const action=this.dataset.action;
overlay.classList.remove("open");

if(action==="free"){
showInfo("Free Bets","No free bets are currently available.");
}

else if(action==="history"){
document.querySelector(".live-stats").scrollIntoView({
behavior:"smooth",
block:"start"
});
}

else if(action==="limits"){
showInfo("Game Limits","Set responsible spending limits before playing. Never wager money you cannot afford to lose.");
}

else if(action==="how"){
showInfo("How To Play","1. Select your bet amount. 2. Press Bet before the round starts. 3. During flight, use Cash Out to collect the displayed multiplier. If the plane crashes before cashout, the bet is lost.");
}

else if(action==="rules"){
showInfo("Game Rules","Each round has a crash multiplier. A bet is paid according to the multiplier when successfully cashed out. A crashed round ends the active bet.");
}

else if(action==="fair"){
showInfo("Provably Fair Settings","Cryptographic fairness verification is not configured in this HTML version. Server-side verification is required to prove round results.");
}

});
});

})();
</script>

<!-- WAITING GIF HANDLING (OPTIMIZED) -->
<script>
(function () {
  const multText = document.getElementById("mult-text");

  if (!multText || !multText.parentNode) return;

  const gif = document.createElement("img");

  const gifURL =
    "https://videotourl.com/gifs/1793972494856-6c354bce-0cd1-4293-8215-fb4532f6736d.gif";

  gif.id = "waiting-gif";
  gif.src = gifURL;
  gif.alt = "Waiting animation";

  multText.parentNode.appendChild(gif);

  const originalResetRound = window.resetRound;
  const originalLaunchPlane = window.launchPlane;

  window.resetRound = function (time) {
    if (typeof originalResetRound === "function") {
      originalResetRound.apply(this, arguments);
    }

    // নতুন রাউন্ড শুরু হলে GIF প্রথম থেকে চালু হবে এবং কাটবে না
    if (!gif.classList.contains("show")) {
      gif.src = gifURL + "?round=" + Date.now();
    }

    gif.classList.add("show");
    multText.classList.add("countdown-hidden");
  };

  window.launchPlane = function () {
    // প্লেন উড়লে GIF বন্ধ হবে
    gif.classList.remove("show");
    multText.classList.remove("countdown-hidden");

    if (typeof originalLaunchPlane === "function") {
      originalLaunchPlane.apply(this, arguments);
    }
  };
})();
</script>
<!-- ROUND HISTORY BUTTON FIX: opens the existing Round History popup -->
<script>
(function () {
  const openButton = document.getElementById("history-more");
  const modal = document.getElementById("history-modal");
  const dialog = modal ? modal.querySelector(".history-dialog") : null;
  const closeButton = document.getElementById("history-close");

  if (!openButton || !modal || !dialog || !closeButton) return;

  function openRoundHistory() {
    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
  }

  function closeRoundHistory() {
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
  }

  openButton.addEventListener("click", openRoundHistory);
  closeButton.addEventListener("click", closeRoundHistory);

  modal.addEventListener("click", function (event) {
    if (event.target === modal) closeRoundHistory();
  });

  dialog.addEventListener("click", function (event) {
    event.stopPropagation();
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && modal.classList.contains("open")) {
      closeRoundHistory();
    }
  });
})();
</script>
